
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venyx Hub Key</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070708;
    color: white;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 0%, #45454d33, transparent 55%),
        radial-gradient(ellipse at 0% 100%, #77778014, transparent 45%),
        #070708;
    z-index: -3;
}

.grid {
    position: fixed;
    inset: 0;
    opacity: .15;
    background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 45px 45px;
    z-index: -2;
}

.light {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .12;
    pointer-events: none;
    animation: lightMove 12s ease-in-out infinite alternate;
}

.light.one {
    background: #bfc0cc;
    top: -220px;
    left: -150px;
}

.light.two {
    background: #777780;
    bottom: -250px;
    right: -150px;
    animation-delay: -5s;
}

@keyframes lightMove {
    to { transform: translate(100px,70px) scale(1.25); }
}

/* PARTICLES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #d9d9e2;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: particleFloat linear infinite;
    opacity: 0;
}

.particle:nth-child(1) { left:10%; animation-duration:8s; }
.particle:nth-child(2) { left:25%; animation-duration:12s; animation-delay:2s; }
.particle:nth-child(3) { left:45%; animation-duration:9s; animation-delay:1s; }
.particle:nth-child(4) { left:65%; animation-duration:11s; animation-delay:3s; }
.particle:nth-child(5) { left:85%; animation-duration:10s; animation-delay:4s; }
.particle:nth-child(6) { left:55%; animation-duration:13s; animation-delay:1s; }
.particle:nth-child(7) { left:35%; animation-duration:10s; animation-delay:3s; }
.particle:nth-child(8) { left:75%; animation-duration:8s; animation-delay:5s; }

@keyframes particleFloat {
    0% { transform:translateY(100vh); opacity:0; }
    15% { opacity:.8; }
    80% { opacity:.4; }
    100% { transform:translateY(-100vh); opacity:0; }
}

/* MAIN */

.wrapper {
    width: 100%;
    max-width: 455px;
    padding: 20px;
    animation: entrance 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: translateY(45px) scale(.92);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

.card {
    position: relative;
    overflow: hidden;
    padding: 35px 27px 26px;
    border-radius: 26px;
    background: linear-gradient(145deg,#17171a,#0d0d0f 50%,#141416);
    border: 1px solid #ffffff15;
    box-shadow: 0 30px 90px #000000aa, inset 0 1px 0 #ffffff12;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 26px;
    background: linear-gradient(120deg,transparent,#ffffff55,#85858b,transparent,#ffffff30,transparent);
    background-size: 300% 300%;
    animation: borderMove 6s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

@keyframes borderMove {
    to { background-position:300% 50%; }
}

.card::after {
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    background:#ffffff06;
    border-radius:50%;
    top:-140px;
    right:-100px;
    filter:blur(50px);
    animation:cardGlow 6s ease-in-out infinite alternate;
}

@keyframes cardGlow {
    to { transform:translate(-70px,100px); }
}

/* LOGO */

.logo-area {
    display:flex;
    justify-content:center;
    margin-bottom:23px;
}

.logo {
    position:relative;
    width:92px;
    height:92px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:linear-gradient(145deg,#333338,#151517 45%,#29292e);
    border:1px solid #ffffff22;
    box-shadow:0 12px 35px #000,inset 0 2px 2px #ffffff20,inset 0 -5px 15px #00000066;
    transform:rotate(-4deg);
    animation:logoHover 4s ease-in-out infinite;
}

.logo::before {
    content:"";
    position:absolute;
    inset:-6px;
    border:1px solid #bdbdc755;
    border-radius:29px;
    animation:logoRing 4s linear infinite;
}

.logo::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:25px;
    background:linear-gradient(120deg,transparent 20%,#ffffff22 45%,transparent 65%);
    background-size:250% 250%;
    animation:logoShine 3s ease-in-out infinite;
}

.logo svg {
    width:64px;
    height:64px;
    position:relative;
    z-index:2;
}

.logo svg path {
    fill:none;
    stroke:url(#silverGradient);
    stroke-width:8;
    stroke-linecap:square;
    stroke-linejoin:bevel;
    filter:drop-shadow(0 0 5px #ffffff55);
    stroke-dasharray:250;
    stroke-dashoffset:250;
    animation:drawLogo 2s ease forwards,logoGlow 3s ease-in-out infinite 2s;
}

@keyframes drawLogo { to { stroke-dashoffset:0; } }

@keyframes logoGlow {
    0%,100% { filter:drop-shadow(0 0 3px #ffffff30); }
    50% { filter:drop-shadow(0 0 12px #ffffffaa); }
}

@keyframes logoHover {
    0%,100% { transform:translateY(0) rotate(-4deg); }
    50% { transform:translateY(-8px) rotate(2deg); }
}

@keyframes logoRing {
    0%,100% { transform:scale(1); opacity:.5; }
    50% { transform:scale(1.08); opacity:.12; }
}

@keyframes logoShine {
    0% { background-position:150% 0; }
    60%,100% { background-position:-150% 0; }
}

/* TITLE */

.title {
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-size:27px;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(180deg,#ffffff,#d0d0d5 45%,#77777e);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle {
    text-align:center;
    margin-top:10px;
    color:#77777e;
    font-size:10px;
    letter-spacing:5px;
    font-weight:700;
}

.line {
    width:75px;
    height:2px;
    margin:20px auto 26px;
    background:linear-gradient(90deg,transparent,#c6c6ce,transparent);
    position:relative;
    overflow:hidden;
}

.line::after {
    content:"";
    position:absolute;
    width:30px;
    height:100%;
    background:white;
    filter:blur(4px);
    animation:lineScan 2s linear infinite;
}

@keyframes lineScan {
    from { left:-30px; }
    to { left:100%; }
}

/* ===== ULTRA ANIMATED KEY MENU ===== */

.key-menu {
    position:relative;
    padding:19px;
    border-radius:17px;
    background:linear-gradient(145deg,#1b1b1e,#0c0c0e);
    border:1px solid #ffffff18;
    overflow:hidden;
    isolation:isolate;
    animation:menuFloat 4s ease-in-out infinite,menuGlow 3s ease-in-out infinite;
    transition:.4s;
}

/* Moving silver border */

.key-menu::before {
    content:"";
    position:absolute;
    inset:-150%;
    z-index:-2;
    background:conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 60deg,
        #ffffff20 90deg,
        #ffffff 125deg,
        #bcbcc5 145deg,
        transparent 180deg,
        transparent 360deg
    );
    animation:borderRotate 5s linear infinite;
}

/* Inner background */

.key-menu::after {
    content:"";
    position:absolute;
    inset:1px;
    border-radius:16px;
    z-index:-1;
    background:
        radial-gradient(circle at 0% 0%,#ffffff12,transparent 50%),
        linear-gradient(145deg,#17171a,#09090b);
}

/* Floating menu */

@keyframes menuFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-5px); }
}

@keyframes menuGlow {
    0%,100% { box-shadow:0 0 10px #ffffff05; }
    50% { box-shadow:0 0 25px #ffffff12,0 0 45px #ffffff05; }
}

@keyframes borderRotate {
    to { transform:rotate(360deg); }
}

/* Decorative light inside menu */

.menu-light {
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ffffff0b;
    filter:blur(35px);
    top:-60px;
    left:-50px;
    animation:menuLightMove 5s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes menuLightMove {
    to { transform:translate(230px,100px); }
}

/* Small particles */

.menu-particles {
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.menu-particles span {
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#dcdce5;
    box-shadow:0 0 8px #fff;
    opacity:0;
    animation:menuParticle 4s infinite;
}

.menu-particles span:nth-child(1) {
    left:15%;bottom:0;animation-delay:0s;
}
.menu-particles span:nth-child(2) {
    left:35%;bottom:0;animation-delay:1s;
}
.menu-particles span:nth-child(3) {
    left:60%;bottom:0;animation-delay:2s;
}
.menu-particles span:nth-child(4) {
    left:80%;bottom:0;animation-delay:3s;
}

@keyframes menuParticle {
    0% { transform:translateY(0);opacity:0; }
    20% { opacity:.8; }
    100% { transform:translateY(-100px);opacity:0; }
}

/* Header */

.key-header {
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.key-label {
    font-size:10px;
    font-weight:800;
    color:#9a9aa2;
    letter-spacing:2px;
}

.badge {
    position:relative;
    overflow:hidden;
    font-size:9px;
    padding:5px 9px;
    border-radius:20px;
    background:#ffffff08;
    border:1px solid #ffffff20;
    color:#d5d5d9;
    letter-spacing:1px;
}

.badge::after {
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,transparent,#ffffff44,transparent);
    animation:badgeShine 2.5s infinite;
}

@keyframes badgeShine {
    0%,60% { left:-100%; }
    100% { left:100%; }
}

/* Key field */

.key-content {
    position:relative;
    z-index:2;
    overflow:hidden;
    display:flex;
    align-items:center;
    width:100%;
    background:#050506;
    border:1px solid #ffffff15;
    border-radius:11px;
    padding:15px 12px;
    transition:.4s;
    animation:keyBoxPulse 3s ease-in-out infinite;
}

.key-content::before {
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:70%;
    height:100%;
    background:linear-gradient(100deg,transparent,#ffffff10,#ffffff25,transparent);
    transform:skewX(-25deg);
    animation:keyScan 3s ease-in-out infinite;
    pointer-events:none;
}

.key-content::after {
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:1px;
    background:linear-gradient(90deg,transparent,#ffffff88,transparent);
    animation:bottomGlow 2s ease-in-out infinite;
}

@keyframes keyScan {
    0%,25% { left:-150%; }
    75%,100% { left:150%; }
}

@keyframes keyBoxPulse {
    0%,100% { border-color:#ffffff12; }
    50% { border-color:#ffffff35; }
}

@keyframes bottomGlow {
    0%,100% { opacity:.2; }
    50% { opacity:1; }
}

/* Lock */

.key-icon {
    position:relative;
    z-index:3;
    flex-shrink:0;
    margin-right:10px;
    width:17px;
    height:17px;
    color:#d0d0d8;
    animation:lockAnimation 3s ease-in-out infinite;
}

@keyframes lockAnimation {
    0%,100% {
        transform:rotate(0deg) scale(1);
        filter:drop-shadow(0 0 2px #ffffff33);
    }
    25% { transform:rotate(-8deg) scale(1.08); }
    50% {
        transform:rotate(0deg) scale(1.15);
        filter:drop-shadow(0 0 8px #ffffff88);
    }
    75% { transform:rotate(8deg) scale(1.08); }
}

/* Key text */

.key-text {
    position:relative;
    z-index:3;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
    flex:1;
    color:#e5e5eb;
    font-size:12px;
    font-weight:600;
    letter-spacing:.3px;
    user-select:all;
    animation:textGlow 4s ease-in-out infinite;
}

.key-text::-webkit-scrollbar {
    display:none;
}

@keyframes textGlow {
    0%,100% { text-shadow:0 0 0 transparent; }
    50% { text-shadow:0 0 8px #ffffff22; }
}

/* Hover effects */

.key-menu:hover {
    transform:translateY(-6px) scale(1.015);
    border-color:#ffffff55;
    box-shadow:0 0 30px #ffffff12,0 10px 30px #00000055;
}

.key-menu:hover .key-content {
    border-color:#ffffff55;
    box-shadow:inset 0 0 20px #ffffff08;
}

.key-menu:hover .key-icon {
    filter:drop-shadow(0 0 10px white);
}

/* COPY BUTTON */

.copy-button {
    position:relative;
    width:100%;
    height:54px;
    margin-top:17px;
    overflow:hidden;
    border:1px solid #ffffff20;
    border-radius:13px;
    color:#080808;
    font-family:'Orbitron',sans-serif;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    background:linear-gradient(110deg,#a2a2aa,#f5f5f7,#b0b0b8,#e6e6e9);
    background-size:300% 300%;
    animation:buttonFlow 5s ease infinite;
    transition:.3s;
}

@keyframes buttonFlow {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

.copy-button::before {
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    transform:skewX(-25deg);
    background:linear-gradient(90deg,transparent,#ffffffaa,transparent);
    animation:buttonShine 3s infinite;
}

@keyframes buttonShine {
    0%,65% { left:-120%; }
    100% { left:150%; }
}

.copy-button:hover {
    transform:translateY(-3px);
    box-shadow:0 8px 25px #ffffff22;
    filter:brightness(1.12);
}

.copy-button:active {
    transform:scale(.96);
}

.button-content {
    position:relative;
    z-index:2;
}

/* STATUS */

.status {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:21px;
}

.status-dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#e0e0e5;
    box-shadow:0 0 10px white;
    animation:statusBlink 2s infinite;
}

.status-text {
    font-size:10px;
    color:#77777f;
    letter-spacing:1.5px;
    font-weight:700;
}

@keyframes statusBlink {
    0%,100% { opacity:1; }
    50% { opacity:.3; }
}

/* FOOTER */

.footer {
    margin-top:23px;
    padding-top:17px;
    border-top:1px solid #ffffff0b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.footer-text {
    font-size:9px;
    color:#55555c;
    letter-spacing:1.5px;
}

.footer-brand {
    font-family:'Orbitron',sans-serif;
    font-size:9px;
    color:#a0a0a8;
    letter-spacing:2px;
}

/* TOAST */

.toast {
    position:fixed;
    bottom:35px;
    left:50%;
    transform:translate(-50%,30px);
    padding:14px 22px;
    border-radius:13px;
    background:#19191c;
    border:1px solid #ffffff25;
    color:#e5e5e9;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 15px 40px #00000080;
    opacity:0;
    transition:.4s;
    z-index:99;
}

.toast.show {
    transform:translate(-50%,0);
    opacity:1;
}

/* MOBILE */

@media(max-width:450px) {
    .wrapper { padding:15px; }
    .card { padding:30px 20px 22px; }
    .title { font-size:24px; }
    .key-text { font-size:11px; }
}

</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>
<div class="light one"></div>
<div class="light two"></div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="wrapper">
<div class="card">

    <!-- LOGO -->
    <div class="logo-area">
        <div class="logo">
            <svg viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="silverGradient"
                        x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="35%" stop-color="#d0d0d5"/>
                        <stop offset="65%" stop-color="#777780"/>
                        <stop offset="100%" stop-color="#f1f1f3"/>
                    </linearGradient>
                </defs>
                <path d="M20 15 L50 82 L80 15"/>
            </svg>
        </div>
    </div>

    <h1 class="title">VENYX HUB</h1>
    <p class="subtitle">PREMIUM KEY SYSTEM</p>

    <div class="line"></div>

    <!-- ANIMATED KEY MENU -->
    <div class="key-menu">

        <div class="menu-light"></div>

        <div class="menu-particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="key-header">
            <span class="key-label">YOUR ACCESS KEY</span>
            <span class="badge">ACTIVE</span>
        </div>

        <div class="key-content">

            <svg class="key-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">
                <rect x="3" y="11" width="18" height="10" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>

            <div class="key-text" id="keyText">
                VenyxHubKeyLsjwowoLalwowjaoJslwiPejwbwjwoi
            </div>

        </div>

    </div>

    <button class="copy-button" onclick="copyKey()">
        <span class="button-content" id="buttonText">COPY KEY</span>
    </button>

    <div class="status">
        <span class="status-dot"></span>
        <span class="status-text">SYSTEM ONLINE · KEY READY</span>
    </div>

    <div class="footer">
        <span class="footer-text">SECURE ACCESS</span>
        <span class="footer-brand">VENYX HUB</span>
    </div>

</div>
</div>

<div class="toast" id="toast">KEY COPIED SUCCESSFULLY ✓</div>

<script>
async function copyKey() {
    const key = document.getElementById("keyText").textContent.trim();
    const buttonText = document.getElementById("buttonText");
    const toast = document.getElementById("toast");

    try {
        await navigator.clipboard.writeText(key);
    } catch (e) {
        const textArea = document.createElement("textarea");
        textArea.value = key;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();
    }

    buttonText.textContent = "COPIED SUCCESSFULLY ✓";
    toast.classList.add("show");

    setTimeout(() => {
        buttonText.textContent = "COPY KEY";
        toast.classList.remove("show");
    }, 2200);
}
</script>

</body>
</html>
